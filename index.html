<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>GV • Gestão Brownies Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0a0a12;
            color: #f0eaff;
            display: flex;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            position: relative;
        }

        .sidebar {
            width: 260px;
            min-width: 260px;
            background: rgba(15, 10, 30, 0.96);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-right: 1px solid rgba(139, 92, 246, 0.4);
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            box-shadow: 12px 0 40px rgba(0, 0, 0, 0.8);
            z-index: 50;
            transition: transform 0.3s ease;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #c084fc, #a855f7, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 8px rgba(168, 85, 247, 0.3);
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .nav-item {
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-weight: 500;
            color: #c4b5fd;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border: 1px solid transparent;
            user-select: none;
            font-size: 0.9rem;
        }

        .nav-item.active {
            background: rgba(124, 58, 237, 0.3);
            border-color: rgba(168, 85, 247, 0.8);
            color: #f5f3ff;
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
        }

        .nav-item:active {
            transform: scale(0.97);
        }

        .main {
            flex: 1;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
            background: radial-gradient(circle at 20% 30%, #1a0e2e, #0a0a12 90%);
            -webkit-overflow-scrolling: touch;
        }

        .view {
            display: none;
            flex-direction: column;
            gap: 1.5rem;
        }

        .view.active-view {
            display: flex;
        }

        .menu-toggle {
            display: none;
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 60;
            background: rgba(30, 20, 50, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.6);
            color: #e9d5ff;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            font-size: 1.3rem;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 45;
        }

        .overlay.active {
            display: block;
        }

        .fab-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 40;
        }

        .fab-main {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            border: none;
            color: white;
            font-size: 1.6rem;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.7);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .fab-main:active {
            transform: scale(0.93);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: rgba(20, 12, 38, 0.98);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(139, 92, 246, 0.6);
            border-radius: 28px;
            padding: 1.5rem;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 30px 60px rgba(124, 58, 237, 0.5);
            animation: modalIn 0.25s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal h3 {
            color: #e9d5ff;
            margin-bottom: 1.2rem;
            font-size: 1.3rem;
        }

        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .modal-form input,
        .modal-form select {
            background: #15102a;
            border: 1px solid #6d28d9;
            border-radius: 14px;
            padding: 0.75rem 0.9rem;
            color: #f0eaff;
            font-size: 0.9rem;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .modal-actions {
            display: flex;
            gap: 0.6rem;
            justify-content: flex-end;
            margin-top: 0.3rem;
        }

        .carrinho-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(25, 18, 45, 0.8);
            border-radius: 14px;
            padding: 0.6rem;
            border: 1px solid rgba(139, 92, 246, 0.4);
            flex-wrap: wrap;
        }

        .carrinho-item select {
            flex: 2;
            min-width: 140px;
            background: #1e1538;
        }

        .carrinho-item input {
            width: 55px;
            text-align: center;
            background: #1e1538;
            border: 1px solid #7e3af2;
        }

        .carrinho-item .item-total {
            font-weight: 600;
            color: #c084fc;
            min-width: 70px;
            text-align: right;
            font-size: 0.85rem;
        }

        .carrinho-total {
            font-size: 1.2rem;
            font-weight: 700;
            color: #a3e635;
            text-align: right;
            padding: 0.5rem 0;
            border-top: 1px solid rgba(168, 85, 247, 0.5);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.8rem;
        }

        .stat-card {
            background: rgba(20, 12, 42, 0.85);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(139, 92, 246, 0.5);
            border-radius: 24px;
            padding: 1rem;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
        }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #c084fc;
            margin-bottom: 0.3rem;
            font-weight: 600;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(to right, #e9d5ff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .panel {
            background: rgba(16, 10, 32, 0.75);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 1rem;
            border: 1px solid rgba(124, 58, 237, 0.45);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            color: #e2ddf5;
            font-size: 0.8rem;
            min-width: 700px;
        }

        th {
            text-align: left;
            padding: 0.6rem;
            color: #d8b4fe;
            font-weight: 600;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 0.6rem;
            border-bottom: 1px solid rgba(139, 92, 246, 0.25);
        }

        .btn {
            background: rgba(124, 58, 237, 0.3);
            border: 1px solid #a855f7;
            color: #f1f5f9;
            padding: 0.45rem 0.9rem;
            border-radius: 28px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.8rem;
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-sm {
            padding: 0.35rem 0.7rem;
            font-size: 0.85rem;
            border-radius: 14px;
            font-weight: 600;
            min-width: 36px;
            text-align: center;
        }

        .btn-primary {
            background: #7c3aed;
            box-shadow: 0 0 16px rgba(139, 92, 246, 0.6);
            border-color: #c084fc;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.3);
            border-color: #ef4444;
        }

        .btn-success {
            background: #10b981;
            border-color: #34d399;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
        }

        .badge {
            padding: 0.2rem 0.6rem;
            border-radius: 18px;
            font-size: 0.65rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .estoque-control {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: rgba(25, 18, 45, 0.6);
            border-radius: 14px;
            padding: 0.2rem;
            border: 1px solid rgba(124, 58, 237, 0.4);
        }

        .estoque-input {
            width: 45px;
            background: transparent;
            border: none;
            color: #f0eaff;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            outline: none;
        }

        .empty-state {
            text-align: center;
            color: #8b7da8;
            padding: 1.5rem;
            font-size: 0.85rem;
        }

        canvas {
            max-height: 250px;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                transform: translateX(-100%);
                width: 260px;
                min-width: 260px;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .menu-toggle {
                display: flex;
            }

            .main {
                padding: 1rem;
                padding-top: 3.5rem;
                gap: 1rem;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.6rem;
            }

            .stat-card {
                padding: 0.8rem;
                border-radius: 20px;
            }

            .stat-value {
                font-size: 1.3rem;
            }

            .btn {
                padding: 0.4rem 0.7rem;
                font-size: 0.75rem;
            }

            .fab-main {
                width: 50px;
                height: 50px;
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
    <div class="overlay" id="overlay"></div>

    <div class="sidebar" id="sidebar">
        <div class="logo"><span>🍫</span> <span>GV Brownies</span></div>
        <div class="nav-menu">
            <div class="nav-item active" data-view="dashboard"><span>📊</span> <span>Dashboard</span></div>
            <div class="nav-item" data-view="vendas"><span>🛒</span> <span>Pedidos</span></div>
            <div class="nav-item" data-view="estoque"><span>📦</span> <span>Estoque</span></div>
            <div class="nav-item" data-view="financeiro"><span>💰</span> <span>Financeiro</span></div>
        </div>
    </div>

    <div class="main">
        <div id="view-dashboard" class="view active-view">
            <div class="stats-grid" id="statsGrid"></div>
            <div class="chart-box panel">
                <h3 style="color:#d8b4fe; margin-bottom:0.6rem;">📈 Vendas por sabor</h3>
                <canvas id="chartVendas"></canvas>
            </div>
        </div>

        <div id="view-vendas" class="view">
            <div class="panel">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.8rem; flex-wrap:wrap; gap:0.5rem;">
                    <h2 style="color:#e9d5ff; font-size:1.1rem;">🛒 Pedidos</h2>
                    <button class="btn btn-primary" id="abrirModalBtn">+ Novo Pedido</button>
                </div>
                <div class="table-wrapper">
                    <table id="pedidosTable">
                        <thead><tr><th>Cliente</th><th>Tel</th><th>Itens</th><th>Qtd</th><th>Valor</th><th>Status</th><th>Data</th><th>Ações</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="view-estoque" class="view">
            <div class="panel">
                <h2 style="color:#e9d5ff; margin-bottom:0.8rem; font-size:1.1rem;">📦 Estoque</h2>
                <div class="table-wrapper">
                    <table id="productTable">
                        <thead><tr><th>Produto</th><th>Preço</th><th>Estoque</th><th>Status</th><th>Ajuste</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="view-financeiro" class="view">
            <div class="stats-grid" id="financeCards"></div>
            <div class="panel">
                <h3 style="color:#e9d5ff; margin-bottom:0.6rem;">📋 Extrato Financeiro</h3>
                <div class="table-wrapper">
                    <table id="financeTable">
                        <thead><tr><th>Cliente</th><th>Itens</th><th>Valor</th><th>Status</th><th>Data</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="fab-container">
            <button class="fab-main" id="fabBtn" title="Novo Pedido">➕</button>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3>🍫 Novo Pedido</h3>
            <div class="modal-form">
                <input type="text" id="modalClienteNome" placeholder="Nome do cliente" required>
                <input type="tel" id="modalClienteTelefone" placeholder="Telefone / WhatsApp">
                <div id="carrinhoContainer"></div>
                <button class="btn btn-sm" id="addItemBtn" type="button">+ Adicionar sabor</button>
                <div class="carrinho-total">Total: <span id="carrinhoTotal">R$ 0,00</span></div>
                <select id="modalStatusPagamento">
                    <option value="pago">✅ Pago</option>
                    <option value="pendente">⏳ Pendente</option>
                </select>
                <div class="modal-actions">
                    <button class="btn" id="cancelarModalBtn">Cancelar</button>
                    <button class="btn btn-primary" id="confirmarModalVendaBtn">💸 Finalizar Pedido</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const DB_NAME = 'GV_BrownieDB_Roxo_SemPIX';
            let db;
            // Preços corrigidos: Ninho c/ KitKat: custo 6.00, venda 11.00
            const defaultProducts = [
                { id: 1, nome: "Brownie Nutella", custo: 6.50, precoVenda: 13.00, estoque: 25 },
                { id: 2, nome: "Brownie Ninho c/ KitKat", custo: 6.00, precoVenda: 11.00, estoque: 18 },
                { id: 3, nome: "Brownie Ninho", custo: 5.20, precoVenda: 10.00, estoque: 30 },
                { id: 4, nome: "Brownie Ninho c/ Nutella", custo: 8.00, precoVenda: 15.00, estoque: 12 }
            ];

            function openDB() {
                return new Promise((resolve) => {
                    const req = indexedDB.open(DB_NAME, 3);
                    req.onupgradeneeded = (e) => {
                        const d = e.target.result;
                        if (!d.objectStoreNames.contains('products')) {
                            const s = d.createObjectStore('products', { keyPath: 'id' });
                            defaultProducts.forEach(p => s.put(p));
                        } else {
                            const tx = e.target.transaction;
                            const store = tx.objectStore('products');
                            defaultProducts.forEach(p => store.put(p));
                        }
                        if (!d.objectStoreNames.contains('pedidos')) {
                            d.createObjectStore('pedidos', { keyPath: 'id', autoIncrement: true });
                        }
                    };
                    req.onsuccess = (e) => { db = e.target.result;
                        resolve(); };
                });
            }

            function getAll(s) { return new Promise((res) => db.transaction(s, 'readonly').objectStore(s).getAll()
                    .onsuccess = (e) => res(e.target.result)); }

            function putItem(s, item) { return new Promise((res) => db.transaction(s, 'readwrite').objectStore(s).put(item)
                    .onsuccess = (e) => res(e.target.result)); }

            function deleteItem(s, id) { return new Promise((res) => db.transaction(s, 'readwrite').objectStore(s).delete(
                    id).onsuccess = res); }

            let products = [],
                pedidos = [];

            async function loadData() {
                products = await getAll('products');
                if (!products.length) {
                    for (const p of defaultProducts) await putItem('products', p);
                    products = [...defaultProducts];
                } else {
                    let updated = false;
                    for (let p of products) {
                        if (p.nome === "Brownie Ninho c/ KitKat" && (p.precoVenda !== 11.00 || p.custo !== 6.00)) {
                            p.precoVenda = 11.00;
                            p.custo = 6.00;
                            await putItem('products', p);
                            updated = true;
                        }
                    }
                    if (updated) products = await getAll('products');
                }
                pedidos = await getAll('pedidos');
            }

            function formatarReal(valor) {
                return 'R$ ' + valor.toFixed(2).replace('.', ',').replace(/,00$/, '');
            }

            const getRecebido = () => pedidos.filter(p => p.status === 'pago').reduce((a, p) => a + p.total, 0);
            const getPendente = () => pedidos.filter(p => p.status === 'pendente').reduce((a, p) => a + p.total, 0);
            const getLucro = () => pedidos.filter(p => p.status === 'pago').reduce((a, p) => a + (p.total - (p.custoTotal || 0)), 0);

            let carrinhoItens = [{ produtoId: '', quantidade: 1 }];

            function atualizarCarrinhoUI() {
                document.getElementById('carrinhoContainer').innerHTML = carrinhoItens.map((item, i) => {
                    const produto = products.find(p => p.id === parseInt(item.produtoId));
                    const subtotal = produto ? (produto.precoVenda * item.quantidade) : 0;
                    return `<div class="carrinho-item">
                        <select class="carrinho-sabor" data-index="${i}"><option value="">Sabor</option>${products.map(p => `<option value="${p.id}" ${parseInt(item.produtoId)===p.id?'selected':''}>${p.nome} - ${formatarReal(p.precoVenda)} (${p.estoque} un.)</option>`).join('')}</select>
                        <input type="number" class="carrinho-qtd" value="${item.quantidade}" min="1" data-index="${i}" style="width:55px;">
                        <span class="item-total">${formatarReal(subtotal)}</span>
                        ${carrinhoItens.length > 1 ? `<button class="btn btn-danger btn-sm remover-item" data-index="${i}">✕</button>` : ''}
                    </div>`;
                }).join('');
                calcularTotalCarrinho();
            }

            function calcularTotalCarrinho() {
                let total = 0;
                document.querySelectorAll('.carrinho-item').forEach(el => {
                    const s = el.querySelector('.carrinho-sabor')?.value;
                    const q = parseInt(el.querySelector('.carrinho-qtd')?.value) || 1;
                    const p = products.find(x => x.id === parseInt(s));
                    if (p) total += p.precoVenda * q;
                });
                document.getElementById('carrinhoTotal').textContent = formatarReal(total);
                return total;
            }

            async function marcarComoPago(pedidoId) {
                const pedido = pedidos.find(p => p.id === pedidoId);
                if (pedido && pedido.status === 'pendente') {
                    pedido.status = 'pago';
                    await putItem('pedidos', pedido);
                    updateUI();
                    alert(`✅ Pedido #${pedidoId} marcado como PAGO!`);
                }
            }

            async function confirmarVenda() {
                const nome = document.getElementById('modalClienteNome').value.trim();
                const tel = document.getElementById('modalClienteTelefone').value.trim();
                const status = document.getElementById('modalStatusPagamento').value;
                if (!nome) return alert('Preencha o nome!');
                const itens = [];
                let total = 0, custoTotal = 0;
                for (const el of document.querySelectorAll('.carrinho-item')) {
                    const saborId = parseInt(el.querySelector('.carrinho-sabor')?.value);
                    const qtd = parseInt(el.querySelector('.carrinho-qtd')?.value) || 1;
                    if (!saborId) continue;
                    const prod = products.find(p => p.id === saborId);
                    if (!prod) continue;
                    if (prod.estoque < qtd) return alert(`Estoque insuficiente para ${prod.nome}!`);
                    itens.push({ produtoId: saborId, nome: prod.nome, quantidade: qtd, preco: prod.precoVenda, custo: prod.custo });
                    total += prod.precoVenda * qtd;
                    custoTotal += prod.custo * qtd;
                }
                if (!itens.length) return alert('Adicione pelo menos um sabor!');
                for (const item of itens) {
                    const prod = products.find(p => p.id === item.produtoId);
                    prod.estoque -= item.quantidade;
                    await putItem('products', prod);
                }
                const np = { cliente: nome, telefone: tel, itens, total, custoTotal, status, date: new Date().toISOString() };
                np.id = await putItem('pedidos', np);
                pedidos.push(np);
                document.getElementById('modalOverlay').classList.remove('active');
                document.getElementById('modalClienteNome').value = '';
                document.getElementById('modalClienteTelefone').value = '';
                carrinhoItens = [{ produtoId: '', quantidade: 1 }];
                updateUI();
                if (status === 'pendente') {
                    alert(`⚠️ Pedido #${np.id} registrado como PENDENTE.\nValor: ${formatarReal(total)}\nO cliente deverá pagar posteriormente.`);
                } else {
                    alert(`✅ Pedido finalizado com sucesso! Valor: ${formatarReal(total)}`);
                }
            }

            function updateUI() {
                document.getElementById('statsGrid').innerHTML = `
                    <div class="stat-card"><div class="stat-label">💰 Recebido</div><div class="stat-value">${formatarReal(getRecebido())}</div></div>
                    <div class="stat-card"><div class="stat-label">⏳ Pendente</div><div class="stat-value">${formatarReal(getPendente())}</div></div>
                    <div class="stat-card"><div class="stat-label">📈 Lucro</div><div class="stat-value">${formatarReal(getLucro())}</div></div>
                    <div class="stat-card"><div class="stat-label">🛒 Pedidos</div><div class="stat-value">${pedidos.length}</div></div>
                    <div class="stat-card"><div class="stat-label">📦 Estoque</div><div class="stat-value">${products.reduce((a,p)=>a+p.estoque,0)}</div></div>`;
                document.getElementById('financeCards').innerHTML = `
                    <div class="stat-card"><div class="stat-label">💰 Recebido</div><div class="stat-value">${formatarReal(getRecebido())}</div></div>
                    <div class="stat-card"><div class="stat-label">⏳ Pendente</div><div class="stat-value">${formatarReal(getPendente())}</div></div>`;
                renderPedidos();
                renderEstoque();
                renderFinanceiro();
                updateChart();
            }

            function renderPedidos() {
                document.querySelector('#pedidosTable tbody').innerHTML = pedidos.length ? pedidos.slice().reverse().map(p => `
                    <tr>
                        <td>${p.cliente}</td>
                        <td>${p.telefone||'—'}</td>
                        <td>${p.itens.map(i=>`${i.quantidade}x ${i.nome}`).join(', ')}</td>
                        <td>${p.itens.reduce((a,i)=>a+i.quantidade,0)}</td>
                        <td>${formatarReal(p.total)}</td>
                        <td><span class="badge" style="background:${p.status==='pago'?'#10b98125':'#f59e0b25'};color:${p.status==='pago'?'#a3e635':'#fbbf24'}">${p.status === 'pago' ? 'Pago' : 'Pendente'}</span></td>
                        <td>${new Date(p.date).toLocaleDateString()}</td>
                        <td style="display: flex; gap: 6px;">
                            ${p.status === 'pendente' ? `<button class="btn btn-sm btn-success" data-marcar-pago="${p.id}">✅ Pago</button>` : ''}
                            <button class="btn btn-sm btn-danger" data-delete="${p.id}">🗑️</button>
                        </td>
                    </tr>`).join('') : '<tr><td colspan="8" class="empty-state">Nenhum pedido</td></tr>';
            }

            function renderEstoque() {
                document.querySelector('#productTable tbody').innerHTML = products.map(p => {
                    const s = p.estoque <= 5 ? 'Crítico' : p.estoque <= 12 ? 'Baixo' : 'Saudável';
                    const c = p.estoque <= 5 ? '#f87171' : p.estoque <= 12 ? '#fbbf24' : '#a3e635';
                    return `<tr>
                        <td>${p.nome}</td>
                        <td>${formatarReal(p.precoVenda)}</td>
                        <td>${p.estoque}</td>
                        <td><span class="badge" style="background:${c}20;color:${c}">${s}</span></td>
                        <td><div class="estoque-control">
                            <button class="btn btn-sm" data-estoque="menos" data-id="${p.id}">−</button>
                            <input type="number" class="estoque-input" value="${p.estoque}" data-id="${p.id}">
                            <button class="btn btn-sm" data-estoque="mais" data-id="${p.id}">+</button>
                        </div></td>
                    </tr>`;
                }).join('');
            }

            function renderFinanceiro() {
                document.querySelector('#financeTable tbody').innerHTML = pedidos.length ? pedidos.slice().reverse().map(p => `<tr>
                    <td>${p.cliente}</td>
                    <td>${p.itens.map(i=>`${i.quantidade}x ${i.nome}`).join(', ')}</td>
                    <td>${formatarReal(p.total)}</td>
                    <td><span class="badge" style="background:${p.status==='pago'?'#10b98125':'#f59e0b25'};color:${p.status==='pago'?'#a3e635':'#fbbf24'}">${p.status === 'pago' ? 'Pago' : 'Pendente'}</span></td>
                    <td>${new Date(p.date).toLocaleDateString()}</td>
                </tr>`).join('') : '<tr><td colspan="5" class="empty-state">Nenhuma transação</td></tr>';
            }

            let chartV;
            function updateChart() {
                const ctx = document.getElementById('chartVendas')?.getContext('2d');
                if (!ctx) return;
                if (chartV) chartV.destroy();
                const data = products.map(p => {
                    let t = 0;
                    pedidos.forEach(ped => ped.itens.forEach(i => { if (i.produtoId === p.id) t += i.quantidade; }));
                    return t;
                });
                chartV = new Chart(ctx, {
                    type: 'bar',
                    data: { labels: products.map(p => p.nome), datasets: [{ label: 'Unidades vendidas', data, backgroundColor: ['#8b5cf6', '#a855f7', '#c084fc', '#d8b4fe'], borderRadius: 10 }] },
                    options: { responsive: true, plugins: { legend: { labels: { color: '#ddd6fe' } } } }
                });
            }

            // Event listeners
            document.getElementById('menuToggle').onclick = () => { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('active'); };
            document.getElementById('overlay').onclick = () => { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('active'); };
            document.querySelectorAll('.nav-item').forEach(el => el.onclick = function() {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active-view'));
                document.getElementById('view-' + this.dataset.view).classList.add('active-view');
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('overlay').classList.remove('active');
                updateUI();
            });
            document.getElementById('fabBtn').onclick = () => { carrinhoItens = [{ produtoId: '', quantidade: 1 }]; atualizarCarrinhoUI(); document.getElementById('modalOverlay').classList.add('active'); };
            document.getElementById('abrirModalBtn').onclick = () => { carrinhoItens = [{ produtoId: '', quantidade: 1 }]; atualizarCarrinhoUI(); document.getElementById('modalOverlay').classList.add('active'); };
            document.getElementById('addItemBtn').onclick = () => { carrinhoItens.push({ produtoId: '', quantidade: 1 }); atualizarCarrinhoUI(); };
            document.getElementById('confirmarModalVendaBtn').onclick = confirmarVenda;
            document.getElementById('cancelarModalBtn').onclick = () => document.getElementById('modalOverlay').classList.remove('active');

            document.addEventListener('click', async (e) => {
                const btn = e.target.closest('button');
                if (!btn) return;
                if (btn.dataset.delete) { if (confirm('Excluir pedido?')) { await deleteItem('pedidos', parseInt(btn.dataset.delete)); pedidos = pedidos.filter(p => p.id !== parseInt(btn.dataset.delete)); updateUI(); } }
                if (btn.dataset.marcarPago) { await marcarComoPago(parseInt(btn.dataset.marcarPago)); }
                if (btn.dataset.estoque === 'mais') { const p = products.find(x => x.id === parseInt(btn.dataset.id)); p.estoque++; await putItem('products', p); updateUI(); }
                if (btn.dataset.estoque === 'menos') { const p = products.find(x => x.id === parseInt(btn.dataset.id)); if (p.estoque > 0) { p.estoque--; await putItem('products', p); updateUI(); } }
                if (btn.classList.contains('remover-item')) { carrinhoItens.splice(parseInt(btn.dataset.index), 1); atualizarCarrinhoUI(); }
            });

            document.addEventListener('change', (e) => {
                if (e.target.classList.contains('estoque-input')) { const id = parseInt(e.target.dataset.id); const v = parseInt(e.target.value); if (!isNaN(v) && v >= 0) { products.find(p => p.id === id).estoque = v; putItem('products', products.find(p => p.id === id)); updateUI(); } }
                if (e.target.classList.contains('carrinho-sabor') || e.target.classList.contains('carrinho-qtd')) { const idx = parseInt(e.target.dataset.index); if (e.target.classList.contains('carrinho-sabor')) carrinhoItens[idx].produtoId = e.target.value; if (e.target.classList.contains('carrinho-qtd')) carrinhoItens[idx].quantidade = parseInt(e.target.value) || 1; calcularTotalCarrinho(); }
            });

            openDB().then(async () => { await loadData(); updateUI(); });
        })();
    </script>
</body>
</html>
