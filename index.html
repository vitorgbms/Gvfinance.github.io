<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>GV • Gestão Brownies Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#08080f;color:#e9e9f0;display:flex;min-height:100vh;overflow-x:hidden}.sidebar{width:260px;background:rgba(10,10,24,0.95);backdrop-filter:blur(28px);border-right:1px solid rgba(124,58,237,0.2);padding:1.5rem 1rem;display:flex;flex-direction:column;gap:2rem;z-index:50}.logo{font-size:1.8rem;font-weight:700;background:linear-gradient(135deg,#d8b4fe,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.nav-item{padding:0.75rem 1rem;border-radius:12px;color:#9ca3af;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:0.9rem}.nav-item.active{background:rgba(124,58,237,0.18);color:#f5f3ff}.main{flex:1;padding:1.5rem;display:flex;flex-direction:column;gap:1.5rem;overflow-y:auto;background:radial-gradient(circle at 20% 30%,#140e24,#08080f 85%)}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0.8rem}.stat-card{background:rgba(18,18,36,0.8);backdrop-filter:blur(18px);border:1px solid rgba(124,58,237,0.25);border-radius:20px;padding:1rem}.stat-label{font-size:0.7rem;text-transform:uppercase;color:#a78bfa}.stat-value{font-size:1.6rem;font-weight:700;background:linear-gradient(to right,#ede9fe,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.panel{background:rgba(16,16,32,0.7);backdrop-filter:blur(16px);border-radius:20px;padding:1rem;border:1px solid rgba(124,58,237,0.25)}table{width:100%;border-collapse:collapse;color:#d1d5db;font-size:0.8rem}th{text-align:left;padding:0.6rem;color:#c4b5fd;font-size:0.65rem;text-transform:uppercase}td{padding:0.6rem;border-bottom:1px solid rgba(124,58,237,0.1)}.btn{background:rgba(124,58,237,0.3);border:1px solid #8b5cf6;color:#f1f5f9;padding:0.45rem 0.9rem;border-radius:24px;cursor:pointer;font-size:0.8rem;font-family:'Inter',sans-serif}.btn-primary{background:#7c3aed}.fab-main{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#a855f7);border:none;color:white;font-size:1.6rem;cursor:pointer;position:fixed;bottom:1.5rem;right:1.5rem;z-index:40}.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem}.modal-overlay.active{display:flex}.modal{background:rgba(20,20,42,0.98);border:1px solid rgba(168,85,247,0.4);border-radius:24px;padding:1.5rem;width:100%;max-width:600px;max-height:90vh;overflow-y:auto}.modal h3{color:#ede9fe;margin-bottom:1rem}.modal-form{display:flex;flex-direction:column;gap:0.8rem}.modal-form input,.modal-form select{background:#12122a;border:1px solid #4c1d95;border-radius:12px;padding:0.7rem;color:white;font-size:0.9rem;outline:none;font-family:'Inter',sans-serif}.carrinho-item{display:flex;align-items:center;gap:0.5rem;background:rgba(18,18,36,0.6);border-radius:12px;padding:0.6rem;flex-wrap:wrap}.carrinho-item select{flex:2;min-width:140px}.carrinho-total{font-size:1.2rem;font-weight:700;color:#10b981;text-align:right;padding:0.5rem 0;border-top:1px solid rgba(124,58,237,0.3)}.pix-container{background:rgba(18,18,36,0.8);border:1px solid rgba(168,85,247,0.5);border-radius:20px;padding:1.5rem;text-align:center;margin-top:1rem}.pix-qrcode{display:flex;justify-content:center;margin-bottom:1rem}.pix-code{background:#12122a;border:1px solid #4c1d95;border-radius:12px;padding:0.7rem;color:#a78bfa;font-size:0.55rem;word-break:break-all;font-family:monospace;text-align:left;max-height:80px;overflow-y:auto}.pix-value{font-size:1.8rem;font-weight:700;color:#10b981}.estoque-control{display:inline-flex;align-items:center;gap:0.3rem;background:rgba(18,18,36,0.5);border-radius:12px;padding:0.2rem}.estoque-input{width:45px;background:transparent;border:none;color:white;text-align:center;font-size:0.9rem;font-weight:600;font-family:'Inter',sans-serif;outline:none}.badge{padding:0.2rem 0.6rem;border-radius:14px;font-size:0.65rem;font-weight:600}.btn-sm{padding:0.3rem 0.6rem;font-size:0.75rem}.btn-danger{background:rgba(239,68,68,0.3);border-color:#ef4444}.btn-copy{background:#10b981;border-color:#34d399}@media(max-width:768px){.sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{padding:1rem;padding-top:3.5rem}.stats-grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <div class="sidebar" id="sidebar">
    <div class="logo"><span>🍫</span> <span>GV</span></div>
    <div class="nav-menu">
      <div class="nav-item active" data-view="dashboard"><span>📊</span> <span>Dashboard</span></div>
      <div class="nav-item" data-view="vendas"><span>🛒</span> <span>Pedidos</span></div>
      <div class="nav-item" data-view="estoque"><span>📦</span> <span>Estoque</span></div>
      <div class="nav-item" data-view="financeiro"><span>💰</span> <span>Financeiro</span></div>
    </div>
  </div>
  <div class="main">
    <div id="view-dashboard" class="view active-view"><div class="stats-grid" id="statsGrid"></div><div class="panel"><h3 style="color:#c4b5fd">📈 Vendas</h3><canvas id="chartVendas"></canvas></div></div>
    <div id="view-vendas" class="view"><div class="panel"><div style="display:flex;justify-content:space-between"><h2 style="color:#ede9fe">🛒 Pedidos</h2><button class="btn btn-primary" id="abrirModalBtn">+ Novo</button></div><table id="pedidosTable"><thead><tr><th>Cliente</th><th>Tel</th><th>Itens</th><th>Qtd</th><th>Valor</th><th>Status</th><th>Data</th><th></th></tr></thead><tbody></tbody></table></div></div>
    <div id="view-estoque" class="view"><div class="panel"><h2 style="color:#ede9fe">📦 Estoque</h2><table id="productTable"><thead><tr><th>Produto</th><th>Preço</th><th>Estoque</th><th>Status</th><th>Ajuste</th></tr></thead><tbody></tbody></table></div></div>
    <div id="view-financeiro" class="view"><div class="stats-grid" id="financeCards"></div><div class="panel"><h3 style="color:#ede9fe">📋 Extrato</h3><table id="financeTable"><thead><tr><th>Cliente</th><th>Itens</th><th>Valor</th><th>Status</th><th>Data</th></tr></thead><tbody></tbody></table></div></div>
    <button class="fab-main" id="fabBtn">➕</button>
  </div>
  <div class="modal-overlay" id="modalOverlay"><div class="modal"><h3>🍫 Novo Pedido</h3><div class="modal-form"><input type="text" id="modalClienteNome" placeholder="Nome"><input type="tel" id="modalClienteTelefone" placeholder="Telefone"><div id="carrinhoContainer"></div><button class="btn btn-sm" id="addItemBtn">+ Sabor</button><div class="carrinho-total">Total: <span id="carrinhoTotal">R$ 0</span></div><select id="modalStatusPagamento"><option value="pago">✅ Pago</option><option value="pendente">⏳ Pendente (PIX)</option></select><div class="modal-actions"><button class="btn" id="cancelarModalBtn">Cancelar</button><button class="btn btn-primary" id="confirmarModalVendaBtn">💸 Finalizar</button></div></div></div></div>
  <div class="modal-overlay" id="pixModalOverlay"><div class="modal"><h3>📱 PIX</h3><div class="pix-container"><p style="color:#c4b5fd">Vitor Gabriel Moraes dos Santos</p><div class="pix-value" id="pixValue"></div><div class="pix-qrcode" id="pixQrcode"></div><div class="pix-code" id="pixCode"></div><button class="btn btn-copy" id="copyPixBtn">📋 Copiar PIX</button></div><button class="btn btn-primary" id="fecharPixModalBtn" style="margin-top:1rem;width:100%">OK</button></div></div>

<script>
(function(){
function fm(v){return 'R$ '+v.toFixed(2).replace('.',',').replace(/,00$/,'');}
const DB='GV_OK';let db;
const PK='9ae03bf0-8f19-433e-87c2-2ea048338eb4';
const PN='Vitor Gabriel Moraes dos Santos';
const PC='SAO PAULO';
const dp=[{id:1,n:"Brownie Nutella",c:6.50,v:13.00,e:25},{id:2,n:"Brownie Ninho c/ KitKat",c:6.00,v:12.00,e:18},{id:3,n:"Brownie Ninho",c:5.20,v:10.00,e:30},{id:4,n:"Brownie Ninho c/ Nutella",c:8.00,v:15.00,e:12}];
function odb(){return new Promise(r=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('p')){const s=d.createObjectStore('p',{keyPath:'id'});dp.forEach(x=>s.put(x));}if(!d.objectStoreNames.contains('v')){d.createObjectStore('v',{keyPath:'id',autoIncrement:true});}};q.onsuccess=e=>{db=e.target.result;r();};})}
function ga(s){return new Promise(r=>db.transaction(s,'readonly').objectStore(s).getAll().onsuccess=e=>r(e.target.result))}
function pi(s,i){return new Promise(r=>db.transaction(s,'readwrite').objectStore(s).put(i).onsuccess=e=>r(e.target.result))}
function di(s,i){return new Promise(r=>db.transaction(s,'readwrite').objectStore(s).delete(i).onsuccess=r)}
let p=[],v=[];
async function ld(){p=await ga('p');if(!p.length){for(const x of dp)await pi('p',x);p=[...dp];}v=await ga('v');}
const gr=()=>v.filter(x=>x.s==='pago').reduce((a,x)=>a+x.t,0);
const gp=()=>v.filter(x=>x.s==='pendente').reduce((a,x)=>a+x.t,0);
const gl=()=>v.filter(x=>x.s==='pago').reduce((a,x)=>a+(x.t-(x.ct||0)),0);
let ci=[{pi:'',q:1}];
function acu(){document.getElementById('carrinhoContainer').innerHTML=ci.map((x,i)=>{const pr=p.find(k=>k.id===parseInt(x.pi));const st=pr?pr.v*x.q:0;return`<div class="carrinho-item"><select class="cs" data-idx="${i}"><option value="">Sabor</option>${p.map(k=>`<option value="${k.id}" ${parseInt(x.pi)===k.id?'selected':''}>${k.n} - ${fm(k.v)}</option>`).join('')}</select><input type="number" class="cq" value="${x.q}" min="1" data-idx="${i}" style="width:55px"><span>${fm(st)}</span>${ci.length>1?`<button class="btn btn-danger btn-sm ri" data-idx="${i}">✕</button>`:''}</div>`}).join('');ctc();}
function ctc(){let t=0;document.querySelectorAll('.carrinho-item').forEach(el=>{const s=el.querySelector('.cs')?.value;const q=parseInt(el.querySelector('.cq')?.value)||1;const pr=p.find(x=>x.id===parseInt(s));if(pr)t+=pr.v*q;});document.getElementById('carrinhoTotal').textContent=fm(t);return t;}

// FUNÇÃO PIX CORRIGIDA - USA PONTO DECIMAL
function gpc(vl){
  const valorStr = vl.toFixed(2); // "12.00"
  const ch=PK;
  const ma=`0014br.gov.bcb.pix01${ch.length.toString().padStart(2,'0')}${ch}`;
  const pl=`00020126${ma.length.toString().padStart(2,'0')}${ma}52040000530398654${valorStr.length.toString().padStart(2,'0')}${valorStr}5802BR59${PN.length.toString().padStart(2,'0')}${PN}60${PC.length.toString().padStart(2,'0')}${PC}62070503***6304`;
  function crc(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);}return(c&0xFFFF).toString(16).toUpperCase().padStart(4,'0');}
  return pl+crc(pl);
}

function mpm(vl){document.getElementById('pixValue').textContent=fm(vl);const cd=gpc(vl);document.getElementById('pixCode').textContent=cd;document.getElementById('pixQrcode').innerHTML='';new QRCode(document.getElementById('pixQrcode'),{text:cd,width:200,height:200,colorDark:'#000',colorLight:'#fff'});document.getElementById('pixModalOverlay').classList.add('active');}
function uu(){document.getElementById('statsGrid').innerHTML=`<div class="stat-card"><div class="stat-label">💰 Recebido</div><div class="stat-value">${fm(gr())}</div></div><div class="stat-card"><div class="stat-label">⏳ Pendente</div><div class="stat-value">${fm(gp())}</div></div><div class="stat-card"><div class="stat-label">📈 Lucro</div><div class="stat-value">${fm(gl())}</div></div><div class="stat-card"><div class="stat-label">🛒 Pedidos</div><div class="stat-value">${v.length}</div></div><div class="stat-card"><div class="stat-label">📦 Estoque</div><div class="stat-value">${p.reduce((a,x)=>a+x.e,0)}</div></div>`;document.getElementById('financeCards').innerHTML=`<div class="stat-card"><div class="stat-label">💰 Recebido</div><div class="stat-value">${fm(gr())}</div></div><div class="stat-card"><div class="stat-label">⏳ Pendente</div><div class="stat-value">${fm(gp())}</div></div>`;rp();re();rf();uc();}
function rp(){document.querySelector('#pedidosTable tbody').innerHTML=v.length?v.slice().reverse().map(x=>`<tr><td>${x.cl}</td><td>${x.tl||'—'}</td><td>${x.it.map(i=>`${i.q}x ${i.n}`).join(', ')}</td><td>${x.it.reduce((a,i)=>a+i.q,0)}</td><td>${fm(x.t)}</td><td><span class="badge" style="background:${x.s==='pago'?'#10b98125':'#f59e0b25'};color:${x.s==='pago'?'#10b981':'#f59e0b'}">${x.s}</span></td><td>${new Date(x.d).toLocaleDateString()}</td><td>${x.s==='pendente'?`<button class="btn btn-sm" data-vp="${x.t}">📱</button>`:''}<button class="btn btn-sm" data-dl="${x.id}">🗑️</button></td></tr>`).join(''):'<tr><td colspan="8" style="text-align:center;color:#6b7280">Nenhum pedido</td></tr>';}
function re(){document.querySelector('#productTable tbody').innerHTML=p.map(x=>{const s=x.e<=5?'Crítico':x.e<=12?'Baixo':'Saudável';const c=x.e<=5?'#ef4444':x.e<=12?'#f59e0b':'#10b981';return`<tr><td>${x.n}</td><td>${fm(x.v)}</td><td>${x.e}</td><td><span class="badge" style="background:${c}20;color:${c}">${s}</span></td><td><div class="estoque-control"><button class="btn btn-sm" data-es="menos" data-id="${x.id}">−</button><input type="number" class="estoque-input" value="${x.e}" data-id="${x.id}"><button class="btn btn-sm" data-es="mais" data-id="${x.id}">+</button></div></td></tr>`}).join('');}
function rf(){document.querySelector('#financeTable tbody').innerHTML=v.length?v.slice().reverse().map(x=>`<tr><td>${x.cl}</td><td>${x.it.map(i=>`${i.q}x ${i.n}`).join(', ')}</td><td>${fm(x.t)}</td><td><span class="badge" style="background:${x.s==='pago'?'#10b98125':'#f59e0b25'};color:${x.s==='pago'?'#10b981':'#f59e0b'}">${x.s}</span></td><td>${new Date(x.d).toLocaleDateString()}</td></tr>`).join(''):'<tr><td colspan="5" style="text-align:center;color:#6b7280">Nenhuma transação</td></tr>';}
async function cv(){const nm=document.getElementById('modalClienteNome').value.trim();const tl=document.getElementById('modalClienteTelefone').value.trim();const st=document.getElementById('modalStatusPagamento').value;if(!nm)return alert('Nome obrigatório!');const it=[];let t=0,ct=0;for(const el of document.querySelectorAll('.carrinho-item')){const si=parseInt(el.querySelector('.cs')?.value);const q=parseInt(el.querySelector('.cq')?.value)||1;if(!si)continue;const pr=p.find(x=>x.id===si);if(!pr||pr.e<q)return alert(`Estoque insuficiente de ${pr.n}!`);it.push({pi:si,n:pr.n,q:q,pr:pr.v,cs:pr.c});t+=pr.v*q;ct+=pr.c*q;}if(!it.length)return alert('Adicione um sabor!');for(const i of it){const pr=p.find(x=>x.id===i.pi);pr.e-=i.q;await pi('p',pr);}const np={cl:nm,tl:tl,it:it,t:t,ct:ct,s:st,d:new Date().toISOString()};np.id=await pi('v',np);v.push(np);document.getElementById('modalOverlay').classList.remove('active');ci=[{pi:'',q:1}];uu();if(st==='pendente')setTimeout(()=>mpm(t),300);}
let ch;function uc(){const ctx=document.getElementById('chartVendas')?.getContext('2d');if(!ctx)return;if(ch)ch.destroy();const dt=p.map(x=>{let t=0;v.forEach(vv=>vv.it.forEach(i=>{if(i.pi===x.id)t+=i.q;}));return t;});ch=new Chart(ctx,{type:'bar',data:{labels:p.map(x=>x.n),datasets:[{label:'Unidades',data:dt,backgroundColor:['#7c3aed','#8b5cf6','#a78bfa','#c4b5fd']}]}});}
document.querySelectorAll('.nav-item').forEach(el=>el.onclick=function(){document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));this.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active-view'));document.getElementById('view-'+this.dataset.view).classList.add('active-view');uu();});
document.getElementById('fabBtn').onclick=()=>{ci=[{pi:'',q:1}];acu();document.getElementById('modalOverlay').classList.add('active');};
document.getElementById('abrirModalBtn').onclick=()=>{ci=[{pi:'',q:1}];acu();document.getElementById('modalOverlay').classList.add('active');};
document.getElementById('addItemBtn').onclick=()=>{ci.push({pi:'',q:1});acu();};
document.getElementById('confirmarModalVendaBtn').onclick=cv;
document.getElementById('cancelarModalBtn').onclick=()=>document.getElementById('modalOverlay').classList.remove('active');
document.getElementById('fecharPixModalBtn').onclick=()=>document.getElementById('pixModalOverlay').classList.remove('active');
document.getElementById('copyPixBtn').onclick=()=>{navigator.clipboard.writeText(document.getElementById('pixCode').textContent);document.getElementById('copyPixBtn').textContent='✅ Copiado!';setTimeout(()=>document.getElementById('copyPixBtn').textContent='📋 Copiar PIX',2000);};
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.dl){if(confirm('Excluir?')){await di('v',parseInt(b.dataset.dl));v=v.filter(x=>x.id!==parseInt(b.dataset.dl));uu();}}if(b.dataset.vp)mpm(parseFloat(b.dataset.vp));if(b.dataset.es==='mais'){const x=p.find(k=>k.id===parseInt(b.dataset.id));x.e++;await pi('p',x);uu();}if(b.dataset.es==='menos'){const x=p.find(k=>k.id===parseInt(b.dataset.id));if(x.e>0){x.e--;await pi('p',x);uu();}}if(b.classList.contains('ri')){ci.splice(parseInt(b.dataset.idx),1);acu();}});
document.addEventListener('change',e=>{if(e.target.classList.contains('estoque-input')){const id=parseInt(e.target.dataset.id);const vl=parseInt(e.target.value);if(!isNaN(vl)&&vl>=0){p.find(x=>x.id===id).e=vl;pi('p',p.find(x=>x.id===id));uu();}}if(e.target.classList.contains('cs')||e.target.classList.contains('cq')){const idx=parseInt(e.target.dataset.idx);if(e.target.classList.contains('cs'))ci[idx].pi=e.target.value;if(e.target.classList.contains('cq'))ci[idx].q=parseInt(e.target.value)||1;ctc();}});
odb().then(async()=>{await ld();uu();});
})();
</script>
</body>
</html>
